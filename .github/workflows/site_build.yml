name: Build Site

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
