<section class="publications" aria-label="科研成果列表">
  {% for publication in site.data.publications %}
    <article class="paper-box">
      <div class="paper-box-image">
        <div>
          <div class="badge">{{ publication.badge | escape }}</div>
          <img src="{{ publication.image | relative_url | escape }}" alt="{{ publication.image_alt | escape }}" loading="lazy">
        </div>
      </div>
      <div class="paper-box-text">
        {{ publication.citation | markdownify }}
        <p class="paper-box-links">
          <a href="{{ publication.web_url | escape }}">网页</a>
          <a href="{{ publication.pdf_url | relative_url | escape }}">下载</a>
        </p>
      </div>
    </article>
  {% endfor %}
</section>
